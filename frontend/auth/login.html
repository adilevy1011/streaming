<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3ecf8e">
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" href="../icons/app_icon.png">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Sign In | Adlv Media Stream</title>
</head>
<body>
    <main class="container auth-page">
        <header class="site-header">
            <h1>Adlv Stream</h1>
        </header>
        <section id="auth-section" aria-labelledby="auth-title">
            <h2 id="auth-title">Sign In</h2>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" autocomplete="username" required>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Log In</button>
                <p id="auth-error" style="color: #ff7777;" role="alert"></p>
            </form>
        </section>
    </main>
    <script src="../js/api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
