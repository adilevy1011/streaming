<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A self-hosted media library and video streaming player.">
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ADLV Media Streamer">
    <meta property="og:title" content="ADLV Media Streamer">
    <meta property="og:description" content="Watch with me on my private server!">
    <meta property="og:image" content="app_icon.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="818">
    <meta property="og:image:height" content="818">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="ADLV Media Streamer">
    <meta name="twitter:description" content="Watch with me on my private server!">
    <meta name="twitter:image" content="app_icon.png">
    <title>Adlv Media Stream</title>
    <style>
        :root { color-scheme: dark; }
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 0; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .hidden { display: none; }
        .site-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .site-header h1 { margin: 0; }
        input, button { padding: 11px 13px; margin: 5px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #333; }
        input { width: 100%; background: #191919; color: #fff; }
        button { background: #3ecf8e; border: none; color: #000; font-weight: bold; cursor: pointer; }
        button:hover { filter: brightness(1.08); }
        .toolbar { display: flex; gap: 10px; align-items: center; margin: 18px 0; }
        .toolbar input { flex: 1; margin: 0; }
        .toolbar button { width: auto; margin: 0; }
        .main-nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 12px; border-bottom: 1px solid #2b2b2b; padding-bottom: 12px; }
        .nav-button { background: #1e1e1e; color: #ddd; border: 1px solid #333; }
        .nav-button.active { background: #3ecf8e; color: #000; border-color: #3ecf8e; }
        .view-header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
        .back-button { background: #1e1e1e; color: #fff; width: auto; }
        .folder-back-button { display: block; width: fit-content; padding: 2px 8px; margin: 2px 0 8px; background: transparent; color: #fff; font-size: 1.5rem; line-height: 1; }
        .folder-back-button:hover, .folder-back-button:focus { background: #2a2a2a; outline: 1px solid #3ecf8e; }
        #media-status:empty { display: none; }
        .media-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        .media-item { padding: 14px; background: #1e1e1e; border: 1px solid #292929; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
        .media-item:hover, .media-item:focus { background: #2a2a2a; outline: 1px solid #3ecf8e; }
        .group-heading { grid-column: 1 / -1; color: #fff; font-size: 1.1rem; font-weight: 700; margin: 18px 0 0; padding: 10px 4px 2px; border-bottom: 1px solid #333; }
        .preview { width: 120px; height: 68px; flex: 0 0 120px; object-fit: cover; border-radius: 5px; background: #080808; pointer-events: none; }
        .preview.preview-loading { display: flex; align-items: center; justify-content: center; }
        .preview.preview-loading::after { content: ''; width: 18px; height: 18px; border: 2px solid #333; border-top-color: #3ecf8e; border-radius: 50%; animation: spin .8s linear infinite; }
        button:disabled { opacity: .65; cursor: wait; }
        .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .72); }
        .modal-backdrop.hidden { display: none; }
        .modal-card { width: min(520px, 100%); padding: 24px; background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 10px; box-shadow: 0 16px 50px rgba(0, 0, 0, .55); }
        .modal-card h2 { margin-top: 0; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
        .modal-actions button { width: auto; }
        .modal-cancel { background: #333; color: #fff; }
        .media-copy { min-width: 0; flex: 1; }
        .library-card { min-height: 68px; }
        .folder-icon { font-size: 1.7rem; flex: 0 0 34px; }
        .media-name { min-width: 0; overflow-wrap: anywhere; word-break: break-word; white-space: normal; line-height: 1.35; }
        .play-label { color: #3ecf8e; white-space: nowrap; }
        .muted { color: #999; }
        .continue-section { margin: 22px 0 26px; }
        .continue-section h2 { margin-bottom: 10px; }
        .continue-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0; }
        .continue-item { position: relative; padding: 14px; background: #1e1e1e; border: 1px solid #292929; border-radius: 8px; cursor: pointer; }
        .continue-item:hover, .continue-item:focus { background: #2a2a2a; outline: 1px solid #3ecf8e; }
        .continue-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .continue-name { display: block; overflow-wrap: anywhere; line-height: 1.35; }
        .continue-menu-button, .remove-progress-button { flex: 0 0 auto; margin: -8px -8px 0 0; padding: 2px 8px; background: transparent; color: #ddd; font-size: 1.3rem; line-height: 1; }
        .continue-menu-button:hover, .continue-menu-button:focus { background: #333; }
        .remove-progress-button { margin-top: -7px; background: #d33; color: #fff; font-size: 1.2rem; }
        .remove-progress-button:hover, .remove-progress-button:focus { background: #f44; }
        .continue-menu { position: absolute; z-index: 2; right: 10px; margin-top: 2px; display: grid; min-width: 170px; padding: 4px; background: #292929; border: 1px solid #444; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
        .continue-menu.hidden { display: none; }
        .continue-menu button { margin: 0; padding: 8px 10px; background: transparent; color: #fff; text-align: left; font-weight: normal; }
        .continue-menu button:hover, .continue-menu button:focus { background: #3a3a3a; }
        .progress-track { height: 5px; margin-top: 10px; background: #333; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: #3ecf8e; }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: #3ecf8e; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        video { width: 100%; max-height: 70vh; margin-top: 15px; border-radius: 8px; background: #000; }
        #auth-error, #media-status { min-height: 1.4em; }
        @media (max-width: 600px) {
            body { padding: 14px; }
            .site-header { align-items: stretch; flex-direction: column; gap: 10px; }
            .site-header h1 { font-size: 1.6rem; }
            .site-header > div { justify-content: stretch; }
            .site-header > div button { flex: 1; }
            .main-nav { gap: 6px; margin-top: 16px; }
            .nav-button { flex: 1 1 calc(50% - 6px); min-height: 42px; }
            .toolbar { align-items: stretch; flex-direction: column; gap: 6px; }
            .toolbar button, .view-header > button { width: 100%; }
            .view-header { align-items: stretch; flex-direction: column; gap: 4px; }
            .view-header h2 { margin-bottom: 4px; }
            .media-list, .continue-list { grid-template-columns: minmax(0, 1fr); }
            .media-item, .continue-item { padding: 12px; }
            .preview { width: 96px; height: 54px; flex-basis: 96px; }
            .modal-card { padding: 18px; }
            .modal-actions { flex-direction: column-reverse; }
            .modal-actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <h1>Adlv Stream</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="refresh-library-button" class="hidden" onclick="refreshLibrary()" style="width: auto;">Refresh library</button>
                <button id="logout-button" class="hidden" onclick="logout()" style="width: auto; background: #ff4444; color: #fff;">Log Out</button>
            </div>
        </header>
        <div id="auth-section">
            <h3>Sign In</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Log In</button>
            <p id="auth-error" style="color: #ff7777;"></p>
        </div>

        <div id="stream-section" class="hidden">
            <nav class="main-nav" aria-label="Media views">
                <button class="nav-button active" data-view="my-library" onclick="showLibrary('my-library')">My Library</button>
                <span id="media-tabs" style="display: contents;"></span>
                <button class="nav-button" data-view="all" onclick="showLibrary('all')">All Videos</button>
            </nav>

            <section id="continue-section" class="continue-section hidden" aria-labelledby="continue-title">
                <h2 id="continue-title">Continue watching</h2>
                <ul id="continue-list" class="continue-list"></ul>
            </section>

            <section id="watch-again-section" class="continue-section hidden" aria-labelledby="watch-again-title">
                <h2 id="watch-again-title">Watch again</h2>
                <ul id="watch-again-list" class="continue-list"></ul>
            </section>

            <section id="library-view">
                <div class="view-header">
                    <h2 id="library-title">Library</h2>
                    <button id="refresh-folder-button" onclick="refreshCurrentFolder()">Refresh</button>
                </div>
                <div class="toolbar">
                    <input id="search" type="search" placeholder="Search this library..." oninput="renderMedia()">
                </div>
                <p id="media-status" class="muted"></p>
                <ul id="media-list" class="media-list"></ul>
            </section>
        </div>
    </div>
    <div id="refresh-confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="refresh-confirm-title">
        <div class="modal-card">
            <h2 id="refresh-confirm-title">Refresh entire library?</h2>
            <p>This will refresh your entire library and might take a few minutes. If you would rather refresh a specific tab, use the local refresh button instead.</p>
            <div class="modal-actions">
                <button id="refresh-confirm-cancel" class="modal-cancel">Cancel</button>
                <button id="refresh-confirm-submit">Refresh library</button>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
