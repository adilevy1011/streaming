<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Watch Together | Adlv Media Stream</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; padding: 24px; background: #121212; color: #fff; font-family: system-ui, sans-serif; }
        .container { max-width: 1000px; margin: auto; }
        .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
        button { padding: 10px 14px; border: 1px solid #333; border-radius: 8px; background: #3ecf8e; color: #000; font-weight: 700; cursor: pointer; }
        button.secondary { background: #292929; color: #fff; }
        button:disabled { opacity: .55; cursor: wait; }
        .room-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr); gap: 18px; margin-top: 18px; }
        .video-player-shell { margin-top: 15px; padding: 10px; background: #090909; border: 1px solid #292929; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.24); }
        .video-frame { position: relative; overflow: hidden; border-radius: 8px; background: #000; }
        .video-frame.user-idle { cursor: none; }
        video { display: block; width: 100%; max-height: 78vh; background: #000; }
        .video-frame:fullscreen, .video-frame:-webkit-full-screen { width: 100vw; height: 100vh; border-radius: 0; }
        .video-frame:fullscreen video, .video-frame:-webkit-full-screen video { width: 100%; height: 100%; max-height: none; object-fit: contain; filter: brightness(1.0001); }
        .timeline-shell { position: absolute; inset: auto 0 0; z-index: 2; padding: 10px 14px 9px; background: linear-gradient(transparent, rgba(0,0,0,.9)); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
        .timeline-shell.controls-visible, .video-frame.paused .timeline-shell { opacity: 1; pointer-events: auto; }
        .timeline-shell > input { display: block; width: 100%; margin: 0 0 7px; accent-color: #3ecf8e; cursor: pointer; }
        .timeline-preview { position: absolute; bottom: 94px; left: 0; display: none; width: 160px; height: 90px; transform: translateX(-50%); background: #080808; border: 2px solid #fff; border-radius: 5px; pointer-events: none; }
        .player-controls { display: flex; align-items: center; gap: 10px; color: #fff; }
        .player-controls button { margin: 0; padding: 2px; border: 0; background: transparent; color: #fff; font-size: 1.35rem; }
        .player-time { min-width: 105px; font-size: .85rem; white-space: nowrap; }
        .volume-control { width: 80px; flex: none; accent-color: #fff; }
        .control-spacer { flex: 1; }
        .settings-wrap { position: relative; }
        .settings-menu { position: absolute; right: 0; bottom: 32px; display: none; min-width: 170px; padding: 8px; background: rgba(25,25,25,.98); border: 1px solid #444; border-radius: 6px; box-shadow: 0 8px 24px #000; }
        .settings-menu.open { display: block; }
        .settings-menu label, .settings-menu select { display: block; width: 100%; margin: 4px 0; color: #fff; font-size: .85rem; }
        .settings-menu select { padding: 5px; background: #333; border: 1px solid #555; border-radius: 4px; }
        .panel { padding: 16px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; }
        .panel + .panel { margin-top: 12px; }
        .link-row { display: flex; gap: 8px; }
        input { min-width: 0; flex: 1; padding: 10px; background: #101010; color: #fff; border: 1px solid #444; border-radius: 7px; }
        #status { min-height: 1.4em; color: #bbb; }
        #participants { display: grid; gap: 8px; padding: 0; margin: 12px 0 0; list-style: none; }
        .person { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; background: #292929; border-radius: 7px; }
        .person small { color: #aaa; }
        .person button { padding: 4px 7px; background: #a33; color: #fff; font-size: .8rem; }
        .notice { padding: 12px; margin-top: 12px; background: #292929; border-radius: 7px; color: #ddd; }
        .modal { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.75); }
        .modal.hidden { display: none; }
        .modal-card { width: min(420px, 100%); padding: 24px; background: #242424; border: 1px solid #555; border-radius: 12px; }
        @media (max-width: 700px) { body { padding: 14px; } .room-grid { grid-template-columns: 1fr; } .video-player-shell { padding: 5px; } .timeline-shell { padding: 8px; } .player-controls { gap: 5px; flex-wrap: wrap; } .player-controls button { min-width: 34px; min-height: 34px; } .player-time { min-width: 0; flex: 1; font-size: .75rem; } .volume-control { width: 54px; } }
    </style>
</head>
<body>
<main class="container">
    <div class="top"><h1>Watch Together</h1><button class="secondary" onclick="location.href='/'">Back to library</button></div>
    <p id="status">Connecting to room...</p>
    <div class="room-grid">
        <section>
            <div class="video-player-shell" aria-label="Video player"><div class="video-frame" id="video-frame">
                <video id="room-video" controlslist="nodownload" preload="metadata" playsinline></video>
                <div id="timeline-shell" class="timeline-shell" aria-label="Video timeline">
                    <input id="preview-timeline" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek video">
                    <div id="timeline-preview" class="timeline-preview" aria-hidden="true"></div>
                    <div class="player-controls">
                        <button id="play-toggle" type="button" aria-label="Play" title="Play">▶</button><span id="player-time" class="player-time">0:00 / 0:00</span>
                        <button id="mute-toggle" type="button" aria-label="Mute" title="Mute">🔊</button><input id="volume-control" class="volume-control" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"><span class="control-spacer"></span>
                        <div class="settings-wrap"><button id="settings-toggle" type="button" aria-label="Settings" title="Settings">⚙</button><div id="settings-menu" class="settings-menu">
                            <label for="playback-rate">Playback speed</label><select id="playback-rate"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
                            <label id="captions-option" class="hidden"><input id="captions-toggle" type="checkbox"> Captions</label>
                        </div></div><button id="fullscreen-toggle" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
                    </div>
                </div>
            </div></div>
            <div id="waiting" class="notice">Press “I’m ready” when you are ready. Playback begins when everyone in the room is ready.</div>
        </section>
        <aside>
            <div class="panel"><h2>Share this room</h2><div class="link-row"><input id="room-link" readonly><button id="copy-link">Copy</button></div></div>
            <div class="panel"><h2>People</h2><ul id="participants"></ul><button id="ready-button">I’m ready</button></div>
        </aside>
    </div>
</main>
<div id="removed-modal" class="modal hidden"><div class="modal-card"><h2>Removed from room</h2><p>You have been removed from this room.</p><button id="removed-ok">OK</button></div></div>
<script src="api.js"></script>
<script src="watch-together.js"></script>
</body>
</html>
