<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="screen-orientation" content="landscape">
    <meta name="description" content="Watch videos with ADLV Media Streamer.">
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, noimageindex">
    <meta name="theme-color" content="#3ecf8e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="icons/app_icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ADLV Media Streamer">
    <meta property="og:title" content="Watch | ADLV Media Streamer">
    <meta property="og:description" content="Watch videos with ADLV Media Streamer.">
    <meta property="og:image" content="icons/app_icon.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="818">
    <meta property="og:image:height" content="818">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Watch | ADLV Media Streamer">
    <meta name="twitter:description" content="Watch videos with ADLV Media Streamer.">
    <meta name="twitter:image" content="icons/app_icon.png">
    <title>Watch | Adlv Media Stream</title>
    <link rel="stylesheet" href="styles/player-common.css">
    <link rel="stylesheet" href="styles/watch.css">
</head>
<body>
    <div class="container">
        <div class="video-player-shell" aria-label="Video player">
            <div class="video-frame" id="video-frame">
                <video id="video-player" controlslist="nodownload" preload="metadata" playsinline fetchpriority="high"></video>
                <div id="timeline-shell" class="timeline-shell hidden" aria-label="Video timeline preview">
                    <input id="preview-timeline" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek video">
                    <div id="timeline-preview" class="timeline-preview" aria-hidden="true"></div>
                    <div class="player-controls">
                        <button id="play-toggle" type="button" aria-label="Play" title="Play">▶</button>
                        <span id="player-time" class="player-time">0:00 / 0:00</span>
                        <button id="mute-toggle" type="button" aria-label="Mute" title="Mute">🔊</button>
                        <input id="volume-control" class="volume-control" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                        <span class="control-spacer"></span>
                        <div class="settings-wrap">
                            <button id="settings-toggle" type="button" aria-label="Settings" title="Settings">⚙</button>
                            <div id="settings-menu" class="settings-menu">
                                <label for="playback-rate">Playback speed</label>
                                <select id="playback-rate">
                                    <option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
                                </select>
                                <label id="captions-option" class="hidden"><input id="captions-toggle" type="checkbox"> Captions</label>
                            </div>
                        </div>
                        <button id="fullscreen-toggle" type="button" aria-label="Fullscreen" title="Fullscreen">⛶</button>
                    </div>
                </div>
                <button class="player-back-button" type="button" aria-label="Back to library" title="Back to library" onclick="event.stopPropagation(); returnToLibrary()">❮</button>
                <div id="video-title" class="video-title" aria-live="polite"></div>
                <p id="completion-message" class="completion-message hidden">This video is over.</p>
                <div id="completion-actions" class="completion-actions hidden">
                    <button id="library-button" class="back-button" type="button">← Back to library</button>
                    <div id="next-video-preview" class="next-video-preview hidden">
                        <div id="next-video-image" role="img" aria-label="Next video preview"></div>
                        <span id="next-video-name"></span>
                    </div>
                    <button id="credits-button" type="button">Watch credits</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="auth/auth.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
